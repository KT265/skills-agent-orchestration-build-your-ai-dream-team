<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Project Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard" role="main">
    <div class="header">
      <div class="title">Project Pulse</div>
      <div class="controls">
        <input class="search" id="search" placeholder="Filter projects" aria-label="Filter projects">
      </div>
    </div>

    <div class="summary" id="summary" aria-hidden="false">
      <div class="tile">Projects: <strong id="count">0</strong></div>
      <div class="tile">High priority: <strong id="highCount">0</strong></div>
    </div>

    <section class="project-grid" id="projects" aria-live="polite">
      <!-- project cards rendered here using .project-card -->
    </section>
  </main>

  <script>
  // Simple renderer: fetch project-data.json and render .project-card elements
  async function load(){
    try{
      const res = await fetch('./project-data.json');
      const data = await res.json();
      const container = document.getElementById('projects');
      const countEl = document.getElementById('count');
      const highEl = document.getElementById('highCount');
      const projects = Array.isArray(data.projects)?data.projects:[];
      countEl.textContent = projects.length;
      highEl.textContent = projects.filter(p=>/high/i.test(p.priority)).length;

      function makeCard(p){
        const el = document.createElement('article');
        el.className = 'project-card';
        el.setAttribute('role','article');
        el.innerHTML = `
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="meta"><div class="owner">${escapeHtml(p.owner)}</div><div class="priority">${escapeHtml(p.priority)}</div></div>
          <div class="status">Status: <span class="badge ${badgeClass(p.status)}">${escapeHtml(p.status)}</span></div>
          <div class="recent">Recent: ${escapeHtml(p.recentActivity)}</div>
        `;
        return el;
      }

      container.innerHTML = '';
      projects.forEach(p=>container.appendChild(makeCard(p)));

      // filtering
      const search = document.getElementById('search');
      search.addEventListener('input',()=>{
        const q = search.value.trim().toLowerCase();
        container.querySelectorAll('.project-card').forEach(card=>{
          const text = card.innerText.toLowerCase();
          card.style.display = q && !text.includes(q)?'none':'block';
        });
      });

    }catch(err){
      console.error('Failed to load projects',err);
      document.getElementById('projects').innerHTML = '<p style="color:var(--muted)">Unable to load project data.</p>';
    }
  }
  function badgeClass(status){
    if(!status) return '';
    const s = status.toLowerCase();
    if(s.includes('on track')) return 'badge on';
    if(s.includes('at risk')) return 'badge risk';
    if(s.includes('block')) return 'badge block';
    return 'badge on';
  }
  function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }
  load();
  </script>
</body>
</html>
